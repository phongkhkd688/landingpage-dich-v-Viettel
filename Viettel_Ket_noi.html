function monthShift(v,delta){const [y,m]=v.split('-').map(Number);return new Date(Date.UTC(y,m-1+delta,1)).toISOString().slice(0,7)}
function stats(m){
 const incoming=orders.filter(o=>o.created.startsWith(m)), won=orders.filter(o=>o.status===3&&o.closed.startsWith(m));
 const converted=incoming.filter(o=>o.status===3).length;
 return {incoming,won,count:incoming.length,sold:won.length,rev:won.reduce((n,o)=>n+o.amount,0),rate:incoming.length?100*converted/incoming.length:0};
}
function change(a,b){return b?((a-b)/b*100>0?'+':'')+((a-b)/b*100).toFixed(1)+'%':a?'Chưa có nền so sánh':'0%'}
function buckets(rows,total){return rows.map(([label,n])=>'<div class="metric"><span>'+esc(label)+'</span><strong>'+n+'</strong></div><div class="bar" aria-hidden="true"><i style="width:'+(total?Math.min(100,n/total*100):0)+'%"></i></div>').join('')}
function report(m){

 const c=stats(m), prior=stats(monthShift(m,-1)), year=stats(monthShift(m,-12)), hits=events.filter(e=>e.day.startsWith(m)), views=hits.filter(e=>e.type==='view').length, opens=hits.filter(e=>e.type==='open').length, sends=hits.filter(e=>e.type==='submit').length;
 const stale=orders.filter(o=>o.status<2&&Date.parse(day())-Date.parse(o.created)>=172800000).length;
 const products=kinds.map((k,i)=>[k,c.incoming.filter(o=>catalog.find(p=>p[0]===o.service)?.[1]===i).length]);const top=products.slice().sort((a,b)=>b[1]-a[1])[0];

 else if(r==='offers')main.innerHTML=title('Chương trình đang hiển thị','Ưu đãi Viettel','Kiểm tra thời hạn, nhóm gói và điều kiện tại nguồn công bố.')+'<div class="grid">'+offerCards()+'</div>';
 else if(r==='track'){
  main.innerHTML=title('Hỗ trợ khách hàng','Tra cứu yêu cầu','Nhập mã yêu cầu và số điện thoại đã đăng ký trên trình duyệt này.')+'<form id="tracking" class="panel form formgrid"><label>Mã yêu cầu<input name="id" required></label><label>Số điện thoại<input name="phone" type="tel" required></label><button class="full">Tra cứu</button></form><div id="lookup" aria-live="polite"></div>';
  $('#tracking').onsubmit=(e)=>{e.preventDefault();const f=e.currentTarget.elements, norm=(v)=>v.replace(/[^0-9]/g,'').replace(/^84(?=\d{9}$)/,'0');const o=orders.find(o=>o.id===f.id.value.trim().toUpperCase()&&norm(o.phone)===norm(f.phone.value));$('#lookup').innerHTML='<div class="band">'+(o?o.id+' · '+statuses[o.status]+' · Ngày tiếp nhận '+o.created:'Không tìm thấy yêu cầu khớp.')+'</div>'};
 }
 else if(['orders','manage-projects','report','settings'].includes(r)){
  const labels={'orders':'Quản lý đơn hàng','manage-projects':'Quản lý dự án CĐBR','report':'Báo cáo kết quả bán hàng','settings':'Tùy biến website'};
  main.innerHTML=title('Khu vực người bán',labels[r],'')+ownerTabs(r);
  if(r==='orders'){main.insertAdjacentHTML('beforeend','<div class="filters"><input id="order-q" type="search" aria-label="Tìm đơn" placeholder="Mã đơn, tên, điện thoại, dịch vụ…"><select id="order-status" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option>'+options(statuses)+'</select></div><div id="order-list"></div>');$('#order-q').oninput=ordersTable;$('#order-status').onchange=ordersTable;ordersTable()}
  if(r==='manage-projects'){main.insertAdjacentHTML('beforeend','<div class="actions section">'+btn('Thêm dự án','data-edit-project=""')+'</div><div class="grid">'+(projects.map(p=>'<article class="card"><span class="tag">'+types[p[2]]+'</span><h3>'+esc(p[1])+'</h3><p>'+esc(p[3])+'</p><b>'+esc(p[4])+'</b>'+btn('Sửa dự án','data-edit-project="'+p[0]+'"','secondary')+'</article>').join('')||empty('Chưa có dự án do người bán nhập.'))+'</div>')}
  if(r==='report'){main.insertAdjacentHTML('beforeend','<label class="filters">Kỳ báo cáo<input class="period" id="month" type="month" min="2000-01" max="2100-12" value="'+day().slice(0,7)+'"></label><div id="report-data"></div>');$('#month').onchange=e=>report(e.target.value);report($('#month').value)}
  if(r==='settings'){main.insertAdjacentHTML('beforeend',settings());$('#config').onsubmit=async(e)=>{e.preventDefault();const f=e.currentTarget.elements;const img=f.image.files[0];if(img&&(img.size>1048576||!['image/png','image/jpeg','image/webp'].includes(img.type))){flash('Chọn ảnh PNG, JPEG hoặc WebP tối đa 1 MB.');return}if(f.bannerLink.value&&!safeUrl(f.bannerLink.value)){flash('Liên kết quảng cáo phải dùng HTTPS.');return}try{const next={...cfg};for(const k of ['name','headline','phone','email','bannerName','bannerText','bannerLink'])next[k]=f[k].value.trim();next.demo=f.demo.checked;next.officialOffer=f.officialOffer.checked;if(f.remove.checked)next.banner='';if(img)next.banner=await new Promise((ok,no)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=no;reader.readAsDataURL(img)});save('config',next);cfg=next;render(false);flash('Đã lưu cấu hình.')}catch{flash('Không thể lưu cấu hình. Kiểm tra dung lượng lưu trữ.')}}}
 }
 else main.innerHTML=home();
 $('#seller').textContent=cfg.name+(cfg.phone?' · '+cfg.phone:'')+(cfg.email?' · '+cfg.email:'');
}
document.addEventListener('click',(e)=>{
 const target=e.target.closest('button,a');if(!target)return;
 if(target.hasAttribute('data-close'))$('#modal').close();
 if(target.dataset.buy)checkout(target.dataset.buy,target.dataset.project);
 if(target.hasAttribute('data-edit-project'))editProject(target.dataset.editProject);
 if(target.dataset.detail){const o=orders.find(x=>x.id===target.dataset.detail);showModal(o.id,'<p><strong>'+esc(o.name)+'</strong> · '+esc(o.phone)+'</p><p>'+esc(o.email||'Chưa có email')+'</p><p>'+esc(o.address||'Chưa có địa chỉ')+'</p><p>'+esc(o.note||'Chưa có ghi chú')+'</p>')}
 if(target.dataset.saveOrder){
  const row=target.closest('tr'), o=orders.find(x=>x.id===target.dataset.saveOrder), amount=row.querySelector('input'), status=+row.querySelector('select').value;
  if(!amount.reportValidity()||amount.value===''){flash('Nhập doanh thu hợp lệ.');return}
  Object.assign(o,{status,amount:+amount.value,closed:status===3?(o.closed||day()):''});save('orders',orders);ordersTable();flash('Đã cập nhật đơn hàng.');
 }
});
window.addEventListener('hashchange',()=>{if($('#modal').open)$('#modal').close();render();window.scrollTo(0,0)});
render();

</script></body></html>
